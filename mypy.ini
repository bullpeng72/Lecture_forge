[mypy]
# Global settings
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False  # Start lenient, tighten over time
check_untyped_defs = True

# Paths to check
files = src/lecture_forge

# Ignore missing imports for third-party libraries without stubs
[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True

[mypy-imagehash.*]
ignore_missing_imports = True

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

[mypy-markdown.*]
ignore_missing_imports = True

[mypy-pygments.*]
ignore_missing_imports = True

[mypy-tenacity.*]
ignore_missing_imports = True

# Gradually enable stricter checks per module
[mypy-lecture_forge.models.*]
disallow_untyped_defs = True
warn_unused_ignores = True

[mypy-lecture_forge.utils.*]
disallow_untyped_defs = True
warn_unused_ignores = True

[mypy-lecture_forge.knowledge.*]
disallow_untyped_defs = True
warn_unused_ignores = True
