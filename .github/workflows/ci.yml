name: CI

# Main CI workflow that runs all checks
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Quick checks that run first
  quick-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check Python syntax
      run: |
        python -m py_compile src/lecture_forge/**/*.py

    - name: Check for merge conflicts
      run: |
        if grep -r "<<<<<<< HEAD" src/; then
          echo "❌ Merge conflict markers found!"
          exit 1
        fi

    - name: Check file sizes
      run: |
        # Check for accidentally committed large files
        find . -type f -size +10M | grep -v ".git" || true

  # Full test suite
  test:
    needs: quick-checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        if [ -d "tests" ]; then
          pytest tests/ -v --cov=lecture_forge --cov-report=term
        else
          echo "⚠️  Tests not yet implemented"
        fi

  # Code quality checks
  quality:
    needs: quick-checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Check formatting
      run: |
        black --check src/

    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Type check
      run: |
        mypy src/lecture_forge --ignore-missing-imports
      continue-on-error: true

  # Security checks
  security:
    needs: quick-checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        pip install -r requirements.txt

    - name: Security scan
      run: |
        bandit -r src/ -ll
        safety check || true
      continue-on-error: true

  # Summary job
  ci-success:
    needs: [quick-checks, test, quality, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check all jobs
      run: |
        if [ "${{ needs.quick-checks.result }}" != "success" ]; then
          echo "❌ Quick checks failed"
          exit 1
        fi
        if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
          echo "❌ Tests failed"
          exit 1
        fi
        if [ "${{ needs.quality.result }}" != "success" ]; then
          echo "❌ Quality checks failed"
          exit 1
        fi
        echo "✅ All CI checks passed!"
