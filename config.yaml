# config.yaml — agent-evaluator 통합 테스트용
# 실행: lecture-forge create -c config.yaml --eval eval_results/
#
# --eval eval_results/ 플래그가 Gate A–G 계측을 활성화한다.
# 완료 후 다음으로 결과를 확인한다:
#   agent-eval dashboard --results eval_results/
#   agent-eval gate eval_results/lecture_eval_*.json --tcr 80 --accuracy 50

# ===== 필수 =====

topic: "AI 에이전트 평가: Harness Gate로 프로덕션 배포 준비도 측정"
duration: 45
audience_level: "intermediate"

# ===== 콘텐츠 소스 =====

urls:
  - "https://github.com/anthropics/anthropic-sdk-python"
  - "https://docs.anthropic.com/en/docs/about-claude/models/overview"

keywords:
  - "AI agent evaluation metrics production"
  - "LLM evaluation harness testing"
  - "agent reliability testing deployment"

image_keywords:
  - "AI agent evaluation dashboard"
  - "software testing metrics"

# ===== 출력 =====

output_name: "agent_eval_lecture"
quality_check: true
quality_threshold: 80
